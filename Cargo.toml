[package]
name = "fragmentation"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
description = "Content-addressed, arbitrary-depth, circular-reflexive trees"
repository = "https://github.com/systemic-engineering/fragmentation"
keywords = ["content-addressed", "tree", "fragment", "git", "hash"]
categories = ["data-structures", "encoding"]

[features]
git = ["dep:git2"]
ssh = ["dep:ssh-key", "dep:x25519-dalek", "dep:chacha20poly1305", "dep:hkdf"]
gpg = []
cli = ["dep:clap", "git"]
fuse = ["git"]
fuse-mount = ["fuse", "dep:fuser", "dep:libc"]

[[bin]]
name = "fragmentation"
required-features = ["cli"]

[[bin]]
name = "frgmnt"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
dashmap = "6"
clap = { version = "4", features = ["derive"], optional = true }
git2 = { version = "0.19", optional = true }
fuser = { version = "0.14", optional = true }
libc = { version = "0.2", optional = true }
ssh-key = { version = "0.6", features = ["std", "ed25519", "crypto"], optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"
